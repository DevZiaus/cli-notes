<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Notes</title>
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"
        />
        <style>
            :root {
                --bg: #f5f6f8;
                --glow: rgba(99, 102, 241, 0.1);
                --card: #ffffff;
                --text: #111827;
                --muted: #6b7280;
                --border: #e5e7eb;
                --border-hover: #c7d2fe;
                --tag-bg: #eef2ff;
                --tag-text: #4338ca;
                --accent: #4f46e5;
                --accent-text: #ffffff;
                --focus-ring: rgba(79, 70, 229, 0.22);
                --danger: #dc2626;
                --danger-bg: rgba(220, 38, 38, 0.08);
                --success: #15803d;
                --success-bg: rgba(21, 128, 61, 0.08);
                --hover-bg: rgba(17, 24, 39, 0.05);
                --input-bg: #f9fafb;
                --shadow:
                    0 1px 2px rgba(16, 24, 40, 0.05),
                    0 2px 6px rgba(16, 24, 40, 0.06);
                --shadow-lg: 0 10px 24px rgba(16, 24, 40, 0.12);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0e1016;
                    --glow: rgba(99, 102, 241, 0.16);
                    --card: #161923;
                    --text: #e5e7eb;
                    --muted: #9ca3af;
                    --border: #262b38;
                    --border-hover: #4b5382;
                    --tag-bg: #242b45;
                    --tag-text: #a5b4fc;
                    --accent: #818cf8;
                    --accent-text: #10131c;
                    --focus-ring: rgba(129, 140, 248, 0.28);
                    --danger: #f87171;
                    --danger-bg: rgba(248, 113, 113, 0.12);
                    --success: #4ade80;
                    --success-bg: rgba(74, 222, 128, 0.1);
                    --hover-bg: rgba(255, 255, 255, 0.06);
                    --input-bg: #12151f;
                    --shadow:
                        0 1px 2px rgba(0, 0, 0, 0.4),
                        0 2px 8px rgba(0, 0, 0, 0.3);
                    --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.5);
                }
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                color: var(--text);
                line-height: 1.55;
                background: radial-gradient(
                        900px 480px at 50% -180px,
                        var(--glow),
                        transparent
                    )
                    var(--bg);
            }

            .page {
                max-width: 1080px;
                margin: 0 auto;
                padding: 48px 24px 64px;
            }

            .page-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 20px;
            }

            .page-header h1 {
                margin: 0;
                font-size: 1.9rem;
                font-weight: 700;
                letter-spacing: -0.02em;
            }

            .count {
                padding: 3px 10px;
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--muted);
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 999px;
            }

            .count:empty {
                display: none;
            }

            .status {
                margin-bottom: 16px;
                padding: 10px 14px;
                font-size: 0.85rem;
                border-radius: 10px;
            }

            .status:empty {
                display: none;
            }

            .status.error {
                color: var(--danger);
                background: var(--danger-bg);
            }

            .status.success {
                color: var(--success);
                background: var(--success-bg);
            }

            .note-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 16px;
                margin-bottom: 20px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                box-shadow: var(--shadow);
            }

            .input {
                width: 100%;
                padding: 10px 12px;
                font: inherit;
                font-size: 0.92rem;
                color: var(--text);
                background: var(--input-bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
            }

            .input::placeholder {
                color: var(--muted);
                opacity: 0.8;
            }

            .input:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--focus-ring);
            }

            textarea.input {
                resize: vertical;
                min-height: 2.8em;
            }

            .form-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .form-row .input {
                flex: 1;
            }

            .btn {
                padding: 8px 14px;
                font: inherit;
                font-size: 0.85rem;
                font-weight: 500;
                color: var(--muted);
                white-space: nowrap;
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 10px;
                cursor: pointer;
                transition:
                    color 0.15s ease,
                    background 0.15s ease,
                    border-color 0.15s ease,
                    opacity 0.15s ease;
            }

            .btn:hover {
                color: var(--text);
                background: var(--hover-bg);
                border-color: var(--border-hover);
            }

            .btn:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .btn:disabled {
                opacity: 0.55;
                cursor: default;
            }

            .btn-primary {
                color: var(--accent-text);
                background: var(--accent);
                border-color: transparent;
            }

            .btn-primary:hover {
                color: var(--accent-text);
                background: var(--accent);
                border-color: transparent;
                opacity: 0.9;
            }

            .btn-danger {
                padding-inline: 10px;
                color: var(--danger);
                border-color: transparent;
            }

            .btn-danger:hover {
                color: var(--danger);
                background: var(--danger-bg);
                border-color: transparent;
            }

            .notes {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 16px;
            }

            .note {
                display: flex;
                flex-direction: column;
                gap: 16px;
                padding: 18px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                box-shadow: var(--shadow);
                transition:
                    transform 0.16s ease,
                    box-shadow 0.16s ease,
                    border-color 0.16s ease;
            }

            .note:hover {
                transform: translateY(-3px);
                border-color: var(--border-hover);
                box-shadow: var(--shadow-lg);
            }

            .note-content {
                flex: 1;
                margin: 0;
                font-size: 0.95rem;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }

            .note-meta {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .tag {
                padding: 2px 9px;
                font-size: 0.72rem;
                font-weight: 600;
                color: var(--tag-text);
                background: var(--tag-bg);
                border-radius: 999px;
            }

            .note-date {
                margin-left: auto;
                font-size: 0.72rem;
                color: var(--muted);
                white-space: nowrap;
            }

            .note-actions {
                display: flex;
                gap: 8px;
            }

            .note-actions .btn {
                padding: 6px 12px;
            }

            .edit-form {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .empty {
                grid-column: 1 / -1;
                padding: 72px 24px;
                text-align: center;
                border: 1px dashed var(--border);
                border-radius: 14px;
            }

            .empty-title {
                margin: 0 0 6px;
                font-size: 1.1rem;
                font-weight: 600;
            }

            .empty-hint {
                margin: 0;
                font-size: 0.9rem;
                color: var(--muted);
            }

            @media (prefers-reduced-motion: reduce) {
                .note {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header class="page-header">
                <h1>Notes</h1>
                <span class="count" id="count"></span>
            </header>

            <div class="status" id="status" role="status"></div>

            <form class="note-form" id="note-form" autocomplete="off">
                <textarea
                    class="input"
                    name="content"
                    rows="2"
                    placeholder="Write a note…"
                    required
                ></textarea>
                <div class="form-row">
                    <input
                        class="input"
                        name="tags"
                        placeholder="tags, comma, separated"
                    />
                    <button class="btn btn-primary" type="submit">
                        Add note
                    </button>
                </div>
            </form>

            <main class="notes" id="notes"></main>
        </div>

        <script>
            const els = {
                count: document.querySelector('#count'),
                status: document.querySelector('#status'),
                form: document.querySelector('#note-form'),
                notes: document.querySelector('#notes'),
            };

            let notes = [];
            let editingId = null;
            let statusTimer = null;

            const request = async (url, options) => {
                const response = await fetch(url, options);

                if (!response.ok) {
                    let message = `the request failed (${response.status})`;

                    try {
                        message = (await response.json()).error ?? message;
                    } catch {
                        // keep the generic message
                    }

                    throw new Error(message);
                }

                return response.status === 204 ? null : response.json();
            };

            const api = {
                list: () => request('/api/notes'),
                create: (note) =>
                    request('/api/notes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(note),
                    }),
                update: (id, note) =>
                    request(`/api/notes/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(note),
                    }),
                remove: (id) =>
                    request(`/api/notes/${id}`, { method: 'DELETE' }),
            };

            const el = (tag, className, text) => {
                const node = document.createElement(tag);

                if (className) {
                    node.className = className;
                }
                if (text !== undefined) {
                    node.textContent = text;
                }

                return node;
            };

            const formatDate = (timestamp) =>
                new Date(timestamp).toLocaleDateString(undefined, {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                });

            const splitTags = (value) =>
                value
                    .split(',')
                    .map((tag) => tag.trim())
                    .filter(Boolean);

            const showStatus = (message, type = 'error') => {
                els.status.textContent = message;
                els.status.className = `status ${type}`;

                clearTimeout(statusTimer);
                statusTimer = setTimeout(() => {
                    els.status.textContent = '';
                    els.status.className = 'status';
                }, 4000);
            };

            const noteCard = (note) => {
                const card = el('article', 'note');

                if (editingId === note.id) {
                    const form = el('form', 'edit-form');
                    const content = el('textarea', 'input');
                    content.name = 'content';
                    content.required = true;
                    content.rows = 3;
                    content.value = note.content;
                    const tags = el('input', 'input');
                    tags.name = 'tags';
                    tags.placeholder = 'tags, comma, separated';
                    tags.value = note.tags.join(', ');
                    const actions = el('div', 'note-actions');
                    const save = el('button', 'btn btn-primary', 'Save');
                    save.type = 'submit';
                    const cancel = el('button', 'btn', 'Cancel');
                    cancel.type = 'button';

                    cancel.addEventListener('click', () => {
                        editingId = null;
                        render();
                    });

                    form.addEventListener('keydown', (event) => {
                        if (event.key === 'Escape') {
                            editingId = null;
                            render();
                        }
                    });

                    form.addEventListener('submit', async (event) => {
                        event.preventDefault();
                        save.disabled = true;

                        try {
                            const updated = await api.update(note.id, {
                                content: content.value.trim(),
                                tags: splitTags(tags.value),
                            });

                            notes = notes.map((item) =>
                                item.id === note.id ? updated : item,
                            );
                            editingId = null;
                            render();
                            showStatus('Note saved.', 'success');
                        } catch (error) {
                            save.disabled = false;
                            showStatus(error.message);
                        }
                    });

                    actions.append(save, cancel);
                    form.append(content, tags, actions);
                    card.append(form);

                    requestAnimationFrame(() => content.focus());
                    return card;
                }

                card.append(el('p', 'note-content', note.content));

                const meta = el('div', 'note-meta');
                const tagWrap = el('div', 'tags');
                note.tags.forEach((tag) =>
                    tagWrap.append(el('span', 'tag', tag)),
                );
                meta.append(
                    tagWrap,
                    el('time', 'note-date', formatDate(note.id)),
                );
                card.append(meta);

                const actions = el('div', 'note-actions');
                const edit = el('button', 'btn', 'Edit');
                edit.type = 'button';
                const remove = el('button', 'btn btn-danger', 'Delete');
                remove.type = 'button';

                edit.addEventListener('click', () => {
                    editingId = note.id;
                    render();
                });

                remove.addEventListener('click', async () => {
                    if (!window.confirm('Delete this note?')) {
                        return;
                    }

                    remove.disabled = true;

                    try {
                        await api.remove(note.id);
                        notes = notes.filter((item) => item.id !== note.id);
                        render();
                        showStatus('Note deleted.', 'success');
                    } catch (error) {
                        remove.disabled = false;
                        showStatus(error.message);
                    }
                });

                actions.append(edit, remove);
                card.append(actions);

                return card;
            };

            const render = () => {
                els.count.textContent = `${notes.length} ${
                    notes.length === 1 ? 'note' : 'notes'
                }`;

                if (notes.length === 0) {
                    const empty = el('div', 'empty');
                    empty.append(
                        el('p', 'empty-title', 'No notes yet'),
                        el(
                            'p',
                            'empty-hint',
                            'Write your first note in the box above.',
                        ),
                    );
                    els.notes.replaceChildren(empty);
                    return;
                }

                els.notes.replaceChildren(...notes.map(noteCard));
            };

            els.form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const contentInput = els.form.elements.content;
                const content = contentInput.value.trim();

                if (!content) {
                    showStatus('A note needs some content.');
                    contentInput.focus();
                    return;
                }

                const submit = els.form.querySelector('button[type="submit"]');
                submit.disabled = true;

                try {
                    const note = await api.create({
                        content,
                        tags: splitTags(els.form.elements.tags.value),
                    });

                    notes.unshift(note);
                    els.form.reset();
                    render();
                    showStatus('Note added.', 'success');
                    contentInput.focus();
                } catch (error) {
                    showStatus(error.message);
                } finally {
                    submit.disabled = false;
                }
            });

            const load = async () => {
                try {
                    notes = await api.list();
                    notes.sort((a, b) => b.id - a.id);
                    render();
                } catch (error) {
                    showStatus(error.message);
                }
            };

            load();
        </script>
    </body>
</html>
